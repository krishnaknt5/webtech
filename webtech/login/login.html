<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: blue;
            font-size: 26px;
        }

        legend {
            background-color: rgb(112, 49, 12);
            padding: 4px 12px;
        }

        h2 {
            color: rgb(0, 255, 255);
            margin: 0;
        }

        form {
            width: 15cm;
            margin: 0 auto;
            padding: 15px;
            background-color: rgb(200, 0, 255);
            font-style: italic;
            color: rgb(247, 246, 246);
            box-sizing: border-box;
        }

        input {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        input[type="tel"], input[type="email"], input[type="password"] {
            width: 60%;
        }

        input:focus {
            background-color: rgb(197, 203, 192);
            color: rgb(21, 0, 255);
            outline: none;
        }

        button {
            padding: 6px 16px;
            margin: 0 5px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }

        button:hover {
            color: rgb(239, 239, 239);
            background-color: green;
            cursor: pointer;
        }

        button:active {
            background-color: rgba(0, 255, 38, 0.53);
        }

        a {
            color: rgb(247, 246, 246);
        }
    </style>
</head>
<body>

    <h1>Welcome to my page</h1>

    <!-- action points to your PHP page. The browser will block navigation if fields are empty. -->
    <form action="http://localhost/kkphps/wpg/home.php" method="POST">
        <fieldset>
            <legend><h2>Sign In</h2></legend>
            <strong>
                <br>
                <label for="Contact">Contact:</label>
                <input type="tel" id="Contact" name="contact" placeholder="+912525254651" required>
                <br><br>

                <label for="Email">Email:</label>
                <input type="email" id="Email" name="email" placeholder="abc@abc.com" required>
                <br><br>

                <label for="Password">Password:</label>
                <input type="password" id="Password" name="password" placeholder="********" required>
                <br><br>

                <!-- Changed to type="submit" so it triggers validation -->
                <button type="submit">Sign In</button>
                <button type="button" onclick="window.location.href='main.html'">Register</button>
                <br><br>

                <a href="forgot.html">Forgot Password?</a>
            </strong>
        </fieldset>
    </form>

</body>
</html>
