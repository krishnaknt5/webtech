<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: blue;
            font-size: 26px;
        }

        h2 {
            color: rgb(0, 255, 255);
            margin: 0;
            padding: 5px 15px;
        }

        legend {
            background-color: rgb(112, 49, 12);
            padding: 5px;
        }

        form {
            width: 15cm;
            margin: 0 auto;
            padding: 15px;
            background-color: rgb(200, 0, 255);
            font-style: italic;
            color: rgb(247, 246, 246);
            box-sizing: border-box;
            border-radius: 8px;
        }

        fieldset {
            border: 2px solid #fff;
            padding: 15px;
        }

        input {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        input[type="text"], input[type="email"], input[type="tel"], input[type="password"], input[type="date"] {
            width: 60%;
        }

        input:checked + label {
            cursor: pointer;
            color: rgb(34, 0, 255);
            font-weight: bold;
        }

        input:focus {
            background-color: rgb(197, 203, 192);
            color: rgb(21, 0, 255);
            outline: none;
        }

        button {
            padding: 6px 14px;
            margin: 0 5px;
            font-weight: bold;
            border-radius: 4px;
            border: none;
        }

        button:hover {
            color: rgb(239, 239, 239);
            background-color: green;
            cursor: pointer;
        }

        button:active {
            background-color: rgba(0, 255, 38, 0.53);
        }

        a {
            color: rgb(247, 246, 246);
            text-decoration: underline;
        }

        a:hover {
            color: rgb(0, 255, 255);
        }
    </style>
</head>
<body>

    <h1>Welcome to my page</h1>

    <form action="http://localhost/kkphps/wpg/home.php" method="POST">
        <fieldset>
            <legend><h2>Sign up</h2></legend>
            <strong>
                <label for="Name">Name:</label>
                <input type="text" id="Name" name="name" placeholder="John Doe" required>
                <br><br>

                <label for="dob">DOB:</label>
                <input type="date" id="dob" name="dob" required>
                <br><br>

                <label for="Contact">Contact:</label>
                <input type="tel" id="Contact" name="contact" placeholder="+912525254651" required>
                <br><br>

                <label for="Email">Email:</label>
                <input type="email" id="Email" name="email" placeholder="abc@abc.com" required>
                <br><br>

                <label for="Password">Password:</label>
                <input type="password" id="Password" name="password" placeholder="********" required>
                <br><br>

                <label for="ConfirmPassword">Re-enter Password:</label>
                <input type="password" id="ConfirmPassword" name="confirm_password" placeholder="********" required>
                <br><br>

                <input type="checkbox" id="terms" required>
                <label for="terms">Agree with all conditions.</label>
                <br><br>
                
                <button type="submit" >Sign up</button>
                
                <br><br>

                <a href="login.html">Sign in if already have an account.</a>
            </strong>
        </fieldset>
    </form>

</body>
</html>
