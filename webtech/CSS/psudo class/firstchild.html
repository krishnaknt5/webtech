
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        input:focus {
            background-color: chartreuse;
            color: red;
        }

        /* First child */
        li:first-child {
            color: red;
        }
        
         /* Last child */
        li:last-child {
            color: purple;
        }

        /* Second child */
        li:nth-child(2) {
            color: blue;
        }

        /* Third child */
        li:nth-child(3) {
            color: green;
        }
button:disabled{

    cursor: pointer;
}
button{

    cursor: pointer;
}
       
    </style>
</head>
<body>

    Name: <input type="text" placeholder="Enter your name">

    <ul>
        <li>HTML</li>

        <li>JS</li>

</body>
</html>
