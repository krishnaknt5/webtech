<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
        }
        li:first-of-type{
            color: rgb(0, 255, 85);
            background-color: rgb(202, 89, 89);
        }

        li:last-of-type{
            color: rgb(255, 0, 0);
            background-color: rgb(163, 71, 162);
        }

        li:nth-child(2){
            color: aqua;
            background-color: rgb(88, 20, 91);
        }
        
        li:nth-child(3){
            color: rgb(255, 0, 242);
            background-color: rgb(15, 0, 172);
        }
    </style>
</head>
<body>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
        <li>REACT</li>
    </ul>
</body>
</html>
