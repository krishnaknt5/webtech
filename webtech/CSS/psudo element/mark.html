<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Unordered List Styles */
        ul li {
            color: rgb(0, 255, 47); /* Changes the text color */
        }
        ul li::marker {
            color: red; /* Changes the bullet color */
        }

        /* Ordered List Styles */
        ol li {
            color: rgb(248, 7, 248); /* Changes the text color */
        }
        ol li::marker {
            color: blue; /* Changes the number color */
        }
    </style>
</head>
<body>
    <h1>FRONTEND TECH</h1>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
        <li>REACT</li>
    </ul>
    
    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
        <li>REACT</li>
    </ol>
</body>
</html>
